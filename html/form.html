<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fomulário</title>
    <link rel="stylesheet" href="../css/dsenho.css">
</head>
<body>
    <header>  <!-- Cabeçalho da página -->
        <div> <!-- Agrupa o título e imagem -->
            <h1>Cadastro no Fã Clube dos Simpsons</h1> <!-- Título principal -->
            <img src="../img/familisa2.jpeg" alt="Família Simpsons" width="600" height="300"> <!--imagem da família-->
        </div>
    </header>
    
    <main> <!-- Conteúdo principal da página -->
        <section> <!-- Seção temática: formulário -->
            <article> <!-- Conteúdo independente: o formulário-->
                <div> <!-- Agrupa o formulário-->
                    <form action="/processar-dados" method="post"> <!-- Formulário; action é para onde será enviado o formulário; method post para dados sensíveis -->
                        
                        <!-- Campo nome -->
                        <label for="nome">Nome:</label> <!-- label cria um rótulo para um elemento do formulário (caixa de texto, botão...) -->
                        <input type="text" id="nome" name="nome" required> <!--O id identifica cada campo individualmente.
                                                                                O for conecta o rótulo ao campo usando o mesmo id.
                                                                                E o name é o nome do dado que será enviado para o banco de dados ou para o servidor.
                                                                                Os três trabalham juntos para organizar, identificar e enviar corretamente as informações do formulário -->
                        <!-- Campo email -->
                        <label for="email">E-mail:</label> <!-- label cria um rótulo para um elemento do formulário (caixa de texto, botão...) -->
                        <input type="email" id="email" name="email" required> <!-- tipo: colocar email; campo obrigatório -->
                        
                        <!-- Campo radio -->
                        <p>Você já assitiu esse desenho?</p> <!-- Pergunta principal -->
                            
                        <input type="radio" id="sim" name="assitiu" value="Sim" required>
                        <label for="sim">Sim, já assiti</label><br> <!--O value é o valor real que será enviado quando aquela opção for selecionada-->
                        <input type="radio" id="não" name="assitiu" value="Não">
                        <label for="não">Não, nunca assisti</label><br>
                        
                        <!-- Campo checkbox-->
                        <p>Selecione seus personagens favoritos</p>
                        <input type="checkbox" id="homer" name="fav" value="Homer">
                        <label for="homer">Homer Simpson</label><br>
                        <input type="checkbox" id="bart" name="fav" value="Bart">
                        <label for="bart">Bart Simpson</label><br>
                        <input type="checkbox" id="lisa" name="fav" value="Lisa">
                        <label for="lisa">Lisa Simpson</label><br>
                        <input type="checkbox" id="marge" name="fav" value="Marge">
                        <label for="marge">Marge Simpson</label><br>
                        <input type="checkbox" id="maggie" name="fav" value="Maggie">
                        <label for="maggie">Maggie Simpson</label><br>
                        
                        <!-- Botão de envio -->
                        <br><input type="submit" value="Enviar Formulário"><br>
                    </form>
                </div>
            </article>
        </section>
    </main><br>
    <nav> <!-- Área de navegação do site -->
        <div> <!-- div usada para agrupar os links de navegação -->
            <a href="../index.html">Voltar para página inicial</a><br> <!--link para a página inicial-->
        </div>
    </nav>

    <footer> <!--rodapé da página-->
        <div> <!-- Div usada para estruturar e estilizar o conteúdo do rodapé -->
            <p>© 2025 Beatriz Costa Chiara. Todos os direitos reservados.</p> 
        </div>
    </footer>
    
</body>
</html>
